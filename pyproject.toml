[project]
name = "idrpred"
version = "2.0.0"
description = "A consensus-based predictor of intrinsically disordered regions in proteins."
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
  {name = "Matthias Blum", email = "contact@matthiasblum.fr"},
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
idrpred = "idrpred.idrpred:main"

[build-system]
requires = ["setuptools", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idrpred = ["data/**/*"]
